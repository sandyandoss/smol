<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>smol — URL Shortener</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #1c1e26;
          color: #e0e0e0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 60px 20px;
        }

        h1 {
          font-size: 3rem;
          font-weight: 800;
          letter-spacing: -2px;
          margin-bottom: 8px;
          color: #ffffff;
        }

        h1 span { color: #818cf8; }

        .subtitle {
          color: #6b7280;
          margin-bottom: 48px;
          font-size: 1rem;
        }

        .card {
          background: #24273a;
          border: 1px solid #2e3148;
          border-radius: 16px;
          padding: 32px;
          width: 100%;
          max-width: 560px;
          margin-bottom: 16px;
        }

        .card h2 {
          font-size: 0.8rem;
          font-weight: 600;
          color: #6b7280;
          text-transform: uppercase;
          letter-spacing: 1px;
          margin-bottom: 20px;
        }

        input {
          width: 100%;
          padding: 13px 16px;
          background: #1c1e26;
          border: 1px solid #2e3148;
          border-radius: 10px;
          color: #e0e0e0;
          font-size: 0.95rem;
          margin-bottom: 12px;
          outline: none;
          transition: border 0.2s;
        }

        input:focus { border-color: #818cf8; }
        input::placeholder { color: #4b5563; }

        button {
          width: 100%;
          padding: 13px;
          background: #818cf8;
          color: white;
          border: none;
          border-radius: 10px;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: #6d77e8; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #2e3148; color: #4b5563; cursor: not-allowed; }

        /* Result box */
        .result {
          display: none;
          margin-top: 20px;
          padding: 20px;
          background: #1c1e26;
          border: 1px solid #2e3148;
          border-radius: 12px;
        }

        .result.show { display: block; }

        .result-label {
          font-size: 0.75rem;
          color: #6b7280;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin-bottom: 8px;
        }

        .short-url-row {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 16px;
        }

        .short-url {
          color: #818cf8;
          font-weight: 700;
          font-size: 1.15rem;
          text-decoration: none;
          word-break: break-all;
          flex: 1;
        }

        .short-url:hover { text-decoration: underline; }

        .copy-btn {
          width: auto;
          padding: 8px 18px;
          font-size: 0.85rem;
          background: #2e3148;
          border-radius: 8px;
          white-space: nowrap;
          flex-shrink: 0;
        }

        .copy-btn:hover { background: #383b55; }

        .qr-wrapper {
          text-align: center;
          margin-top: 4px;
        }

        .qr-label {
          font-size: 0.75rem;
          color: #6b7280;
          margin-bottom: 10px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .qr-img {
          border-radius: 10px;
          border: 1px solid #2e3148;
          background: #fff;
          padding: 6px;
        }

        /* Error */
        .error {
          display: none;
          margin-top: 12px;
          padding: 12px 16px;
          background: #2a1f2e;
          border: 1px solid #6b3a5a;
          border-radius: 10px;
          color: #f87171;
          font-size: 0.9rem;
        }

        .error.show { display: block; }

        /* Analytics toggle */
        .analytics-toggle {
          width: 100%;
          max-width: 560px;
          background: none;
          border: 1px dashed #2e3148;
          border-radius: 12px;
          color: #6b7280;
          font-size: 0.85rem;
          font-weight: 500;
          padding: 12px;
          cursor: pointer;
          margin-bottom: 16px;
          transition: all 0.2s;
        }

        .analytics-toggle:hover {
          border-color: #818cf8;
          color: #818cf8;
          background: none;
          transform: none;
        }

        .analytics-section {
          display: none;
          width: 100%;
          max-width: 560px;
        }

        .analytics-section.show { display: block; }

        /* Stats grid */
        .analytics-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin-top: 16px;
        }

        .stat-box {
          background: #1c1e26;
          border: 1px solid #2e3148;
          border-radius: 10px;
          padding: 14px;
          text-align: center;
        }

        .stat-number {
          font-size: 1.6rem;
          font-weight: 700;
          color: #818cf8;
        }

        .stat-label {
          font-size: 0.7rem;
          color: #6b7280;
          margin-top: 4px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .analytics-meta {
          margin-top: 14px;
          font-size: 0.85rem;
          color: #6b7280;
          line-height: 1.8;
        }

        .analytics-meta span { color: #c0c4d8; }

        .loader {
          display: inline-block;
          width: 14px;
          height: 14px;
          border: 2px solid #ffffff33;
          border-top-color: #fff;
          border-radius: 50%;
          animation: spin 0.7s linear infinite;
          vertical-align: middle;
          margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
          color: #374151;
          font-size: 0.78rem;
          margin-top: 32px;
        }

        .tag {
          display: inline-block;
          background: #2e3148;
          color: #818cf8;
          font-size: 0.7rem;
          padding: 2px 8px;
          border-radius: 20px;
          margin-left: 6px;
          vertical-align: middle;
          font-weight: 600;
          letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<h1>sm<span>o</span>l</h1>
<p class="subtitle"> Make your long URLs tiny, instantly</p>

<!-- SHORTEN CARD -->
<div class="card">
    <h2>Shorten a URL</h2>

    <input
            type="url"
            id="originalUrl"
            placeholder="https://your-long-url.com/goes/here"
    />

    <input
            type="text"
            id="customAlias"
            placeholder="Custom alias (optional) — e.g. my-link"
            maxlength="50"
    />

    <button id="shortenBtn" onclick="shortenUrl()">
        Shorten URL
    </button>

    <div class="error" id="shortenError"></div>

    <div class="result" id="shortenResult">
        <div class="result-label">Your short link</div>
        <div class="short-url-row">
            <a class="short-url" id="shortUrlLink" href="#" target="_blank"></a>
            <button class="copy-btn" onclick="copyUrl()">Copy</button>
        </div>
        <div class="qr-wrapper">
            <div class="qr-label">QR Code</div>
            <img class="qr-img" id="qrImage" width="150" height="150" alt="QR Code" />
        </div>
    </div>
</div>

<!-- ANALYTICS TOGGLE -->
<button class="analytics-toggle" onclick="toggleAnalytics()">
    📊 Check link analytics
</button>

<!-- ANALYTICS SECTION (hidden by default) -->
<div class="analytics-section" id="analyticsSection">
    <div class="card">
        <h2>Analytics <span class="tag">OPTIONAL</span></h2>

        <input
                type="text"
                id="analyticsCode"
                placeholder="Enter short code — e.g. 1 or my-link"
        />
        <button onclick="getAnalytics()">Get Stats</button>

        <div class="error" id="analyticsError"></div>

        <div class="result" id="analyticsResult">
            <div class="analytics-grid">
                <div class="stat-box">
                    <div class="stat-number" id="totalClicks">0</div>
                    <div class="stat-label">Total Clicks</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="clicks24h">0</div>
                    <div class="stat-label">Last 24h</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="clicks7d">0</div>
                    <div class="stat-label">Last 7 Days</div>
                </div>
            </div>
            <div class="analytics-meta">
                <div>Original URL: <span id="analyticsOriginal"></span></div>
                <div>Created: <span id="analyticsCreated"></span></div>
                <div>Status: <span id="analyticsStatus"></span></div>
            </div>
        </div>
    </div>
</div>
<p>because life's too short for long URLs </p>
<p class="footer">smol · @2026</p>

<script>
    const API = 'http://13.53.247.99';

    // Toggle analytics section visibility
    function toggleAnalytics() {
      const section = document.getElementById('analyticsSection');
      const btn = document.querySelector('.analytics-toggle');
      const isVisible = section.classList.contains('show');
      section.className = isVisible ? 'analytics-section' : 'analytics-section show';
      btn.textContent = isVisible ? '📊 Check link analytics' : '✖ Hide analytics';
    }

    async function shortenUrl() {
      const btn        = document.getElementById('shortenBtn');
      const errorDiv   = document.getElementById('shortenError');
      const resultDiv  = document.getElementById('shortenResult');

      const originalUrl = document.getElementById('originalUrl').value.trim();
      const customAlias = document.getElementById('customAlias').value.trim();

      // Reset
      errorDiv.className  = 'error';
      resultDiv.className = 'result';

      if (!originalUrl) {
        showError('shortenError', 'Please enter a URL to shorten.');
        return;
      }

      const body = { originalUrl };
      if (customAlias) body.customAlias = customAlias;

      btn.disabled    = true;
      btn.innerHTML   = '<span class="loader"></span>Shortening...';

      try {
        const res  = await fetch(`${API}/api/urls`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) {
          // Show validation errors OR alias conflict clearly
          let msg = data.message || 'Something went wrong.';

          if (res.status === 409) {
            // Alias already taken
            msg = `❌ The alias "${customAlias}" is already taken. Please choose a different one.`;
          } else if (data.fieldErrors) {
            msg = Object.values(data.fieldErrors).join(', ');
          }

          showError('shortenError', msg);
          return;
        }

        // Success — show result
        const link    = document.getElementById('shortUrlLink');
        link.href     = data.shortUrl;
        link.textContent = data.shortUrl;

        document.getElementById('qrImage').src =
          `${API}/api/qr/${data.shortCode}`;

        resultDiv.className = 'result show';

        // Auto-fill analytics box with the new code
        document.getElementById('analyticsCode').value = data.shortCode;

      } catch (err) {
        showError('shortenError', 'Could not reach the server. Is the app running?');
      } finally {
        btn.disabled  = false;
        btn.innerHTML = 'Shorten URL';
      }
    }

    async function getAnalytics() {
      const code      = document.getElementById('analyticsCode').value.trim();
      const errorDiv  = document.getElementById('analyticsError');
      const resultDiv = document.getElementById('analyticsResult');

      errorDiv.className  = 'error';
      resultDiv.className = 'result';

      if (!code) {
        showError('analyticsError', 'Please enter a short code.');
        return;
      }

      try {
        const res  = await fetch(`${API}/api/urls/${code}/analytics`);
        const data = await res.json();

        if (!res.ok) {
          showError('analyticsError', data.message || 'Short code not found.');
          return;
        }

        document.getElementById('totalClicks').textContent = data.totalClicks;
        document.getElementById('clicks24h').textContent   = data.clicksLast24Hours;
        document.getElementById('clicks7d').textContent    = data.clicksLast7Days;
        document.getElementById('analyticsOriginal').textContent =
          data.originalUrl.length > 50
            ? data.originalUrl.substring(0, 50) + '...'
            : data.originalUrl;
        document.getElementById('analyticsCreated').textContent =
          new Date(data.createdAt).toLocaleString();
        document.getElementById('analyticsStatus').textContent =
          data.expired ? '❌ Expired' : '✅ Active';

        resultDiv.className = 'result show';

      } catch (err) {
        showError('analyticsError', 'Could not reach the server.');
      }
    }

    function copyUrl() {
      const url = document.getElementById('shortUrlLink').textContent;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '✓ Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    }

    function showError(id, message) {
      const el = document.getElementById(id);
      el.textContent  = message;
      el.className    = 'error show';
    }

    // Enter key support
    document.getElementById('originalUrl')
      .addEventListener('keydown', e => { if (e.key === 'Enter') shortenUrl(); });
    document.getElementById('analyticsCode')
      .addEventListener('keydown', e => { if (e.key === 'Enter') getAnalytics(); });
</script>

</body>
</html>
